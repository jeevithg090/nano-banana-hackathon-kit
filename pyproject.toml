[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-banana-kit"
dynamic = ["version"]
description = "Starter helpers and CLI for Gemini's image model (Nano Banana)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["google-genai>=1.32.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nano-banana = "nano_banana.cli:main"

[tool.setuptools]
package-dir = { "" = "examples/python" }
packages = ["nano_banana"]

[tool.setuptools.dynamic]
version = { attr = "nano_banana.__version__" }

[tool.pytest.ini_options]
testpaths = ["examples/python/tests"]
pythonpath = ["examples/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]
extend-exclude = ["examples/javascript"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nano_banana"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are tutorials: allow long prompt strings and imports near first use.
"*.ipynb" = ["E501", "E402"]
